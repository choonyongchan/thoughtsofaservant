<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgBloom" cx="74%" cy="45%" r="50%">
      <stop offset="0%"   stop-color="#0a1840" stop-opacity="0.6"/>
      <stop offset="55%"  stop-color="#040a28" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#060b18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redAccent" cx="30%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#aa1820" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#aa1820" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#12204a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060b18"/>
  <rect x="620" width="580" height="580" fill="url(#grid)" opacity="0.45"/>
  <rect width="1200" height="630" fill="url(#bgBloom)"/>
  <rect width="1200" height="630" fill="url(#redAccent)"/>

  <!-- Bipartite matching graph: proposers (left column) and receivers (right column) -->
  <g stroke-linecap="round">
    <!-- faint candidate edges -->
    <g stroke="#1f3570" stroke-width="1.5" opacity="0.8">
      <line x1="760" y1="150" x2="1020" y2="230"/>
      <line x1="760" y1="150" x2="1020" y2="390"/>
      <line x1="760" y1="270" x2="1020" y2="110"/>
      <line x1="760" y1="270" x2="1020" y2="470"/>
      <line x1="760" y1="390" x2="1020" y2="110"/>
      <line x1="760" y1="390" x2="1020" y2="230"/>
      <line x1="760" y1="510" x2="1020" y2="350"/>
      <line x1="760" y1="510" x2="1020" y2="230"/>
    </g>
    <!-- rejected proposal (dashed red) -->
    <line x1="760" y1="270" x2="1020" y2="230" stroke="#cc2030" stroke-width="2" stroke-dasharray="8 7" opacity="0.75"/>
    <!-- stable matching (bright) -->
    <g stroke="#5090ff" stroke-width="3.5" filter="url(#glow)">
      <line x1="760" y1="150" x2="1020" y2="110"/>
      <line x1="760" y1="270" x2="1020" y2="350"/>
      <line x1="760" y1="390" x2="1020" y2="470"/>
      <line x1="760" y1="510" x2="1020" y2="230"/>
    </g>
  </g>
  <!-- Nodes -->
  <g filter="url(#glow)">
    <g fill="#0a1830" stroke="#5090ff" stroke-width="2.5">
      <circle cx="760" cy="150" r="20"/>
      <circle cx="760" cy="270" r="20"/>
      <circle cx="760" cy="390" r="20"/>
      <circle cx="760" cy="510" r="20"/>
    </g>
    <g fill="#1a0a14" stroke="#e05060" stroke-width="2.5">
      <circle cx="1020" cy="110" r="20"/>
      <circle cx="1020" cy="230" r="20"/>
      <circle cx="1020" cy="350" r="20"/>
      <circle cx="1020" cy="470" r="20"/>
    </g>
  </g>
  <!-- small hearts inside receiver nodes -->
  <g fill="#e05060" opacity="0.9">
    <path transform="translate(1020 112) scale(0.55)" d="M0 8 C-14 -2 -12 -14 -4 -14 C0 -14 0 -10 0 -9 C0 -10 0 -14 4 -14 C12 -14 14 -2 0 8 Z"/>
    <path transform="translate(1020 232) scale(0.55)" d="M0 8 C-14 -2 -12 -14 -4 -14 C0 -14 0 -10 0 -9 C0 -10 0 -14 4 -14 C12 -14 14 -2 0 8 Z"/>
    <path transform="translate(1020 352) scale(0.55)" d="M0 8 C-14 -2 -12 -14 -4 -14 C0 -14 0 -10 0 -9 C0 -10 0 -14 4 -14 C12 -14 14 -2 0 8 Z"/>
    <path transform="translate(1020 472) scale(0.55)" d="M0 8 C-14 -2 -12 -14 -4 -14 C0 -14 0 -10 0 -9 C0 -10 0 -14 4 -14 C12 -14 14 -2 0 8 Z"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#4a70b0" text-anchor="middle" opacity="0.85">
    <text x="760" y="100">PROPOSE</text>
    <text x="1020" y="60">HOLD / REJECT</text>
  </g>
  <!-- round counter pills -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="850" y="530" width="80" height="20" rx="10" fill="#0a1830" stroke="#1840aa" opacity="0.8"/>
    <text x="890" y="544" fill="#4488ff" opacity="0.8">O(n²)</text>
  </g>

  <!-- Left accent bar -->
  <rect x="30" y="50" width="5" height="400" fill="#cc2030"/>

  <!-- Category pill -->
  <rect x="48" y="50" width="196" height="30" rx="15" fill="#cc2030"/>
  <text x="146" y="70" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2">GAME THEORY</text>

  <!-- Title -->
  <text x="48" y="170" fill="white" font-family="Arial Black, Impact, sans-serif" font-size="60" font-weight="900" letter-spacing="-1" filter="url(#textShadow)">Whoever</text>
  <text x="48" y="242" fill="white" font-family="Arial Black, Impact, sans-serif" font-size="60" font-weight="900" letter-spacing="-1" filter="url(#textShadow)">Proposes Wins</text>
  <rect x="48" y="260" width="460" height="4" fill="#cc2030"/>

  <!-- Subtitle -->
  <text x="48" y="304" fill="#7a9ab8" font-family="Arial, Helvetica, sans-serif" font-size="18">The Nobel-Prize maths behind FirstDate,</text>
  <text x="48" y="330" fill="#7a9ab8" font-family="Arial, Helvetica, sans-serif" font-size="18">Singapore's government matchmaker.</text>

  <!-- Concept pills -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="48" y="366" width="104" height="20" rx="10" fill="#0a1830" stroke="#1840aa" opacity="0.8"/>
    <text x="100" y="380" fill="#4488ff" opacity="0.8">Gale-Shapley</text>
    <rect x="164" y="366" width="116" height="20" rx="10" fill="#0a1830" stroke="#1840aa" opacity="0.8"/>
    <text x="222" y="380" fill="#4488ff" opacity="0.8">Stable Matching</text>
    <rect x="292" y="366" width="104" height="20" rx="10" fill="#0a1830" stroke="#1840aa" opacity="0.8"/>
    <text x="344" y="380" fill="#4488ff" opacity="0.8">Blocking Pair</text>
    <rect x="48" y="394" width="72" height="20" rx="10" fill="#0d0818" stroke="#881830" opacity="0.8"/>
    <text x="84" y="408" fill="#cc3040" opacity="0.85">22 vs 218</text>
    <rect x="132" y="394" width="92" height="20" rx="10" fill="#0d0818" stroke="#881830" opacity="0.8"/>
    <text x="178" y="408" fill="#cc3040" opacity="0.85">Short Side</text>
    <rect x="236" y="394" width="92" height="20" rx="10" fill="#0d0818" stroke="#881830" opacity="0.8"/>
    <text x="282" y="408" fill="#cc3040" opacity="0.85">TFR 0.87</text>
  </g>

  <!-- Bottom author bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#060c1a"/>
  <rect x="0" y="580" width="1200" height="2" fill="#cc2030"/>
  <text x="40" y="612" fill="#c0d0e0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Choon Yong</text>
  <text x="155" y="612" fill="#3a5060" font-family="Arial, Helvetica, sans-serif" font-size="14">·</text>
  <text x="172" y="612" fill="#4a6070" font-family="Arial, Helvetica, sans-serif" font-size="14">October 4, 2026</text>
</svg>
