<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">

  <!-- Card -->
  <rect x="1" y="1" width="998" height="458" rx="10" fill="#FFFDF9" stroke="#E8DFD0" stroke-width="2"/>

  <!-- Title -->
  <text x="48" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C">Two routes, one destination</text>
  <rect x="48" y="66" width="64" height="3" fill="#cc2030"/>

  <!-- ══════════ Ground line ══════════ -->
  <line x1="110" y1="366" x2="890" y2="366" stroke="#DDD3C4" stroke-width="1.5"/>
  <line x1="120" y1="360" x2="120" y2="372" stroke="#C9BFB0" stroke-width="1.5"/>
  <line x1="860" y1="360" x2="860" y2="372" stroke="#C9BFB0" stroke-width="1.5"/>
  <text x="120" y="390" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="12" fill="#8A7F6E">age 12</text>
  <text x="860" y="390" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="12" fill="#8A7F6E">age 25</text>

  <!-- ══════════ Route A: the straight line ══════════ -->
  <line x1="120" y1="300" x2="860" y2="140" stroke="#1a3a70" stroke-width="3" stroke-linecap="round"/>

  <!-- ══════════ Route B: how it usually goes ══════════ -->
  <path d="M120 300 C170 344 212 232 272 266 C332 300 350 186 420 218
           C490 250 500 330 570 272 C640 214 662 300 720 228
           C778 156 800 196 860 140"
        fill="none" stroke="#cc2030" stroke-width="2.6" stroke-linecap="round"
        stroke-dasharray="9,6" opacity="0.85"/>

  <!-- Start point -->
  <circle cx="120" cy="300" r="6" fill="#C9BFB0"/>

  <!-- Shared destination -->
  <circle cx="860" cy="140" r="9" fill="#2C2C2C"/>
  <circle cx="860" cy="140" r="16" fill="none" stroke="#2C2C2C" stroke-opacity="0.28" stroke-width="1.5"/>
  <text x="844" y="112" text-anchor="end" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="15" fill="#2C2C2C">the same work</text>
  <line x1="848" y1="118" x2="856" y2="128" stroke="#2C2C2C" stroke-width="1.2"/>

  <!-- ══════════ Legend ══════════ -->
  <line x1="180" y1="424" x2="224" y2="424" stroke="#1a3a70" stroke-width="3" stroke-linecap="round"/>
  <text x="236" y="429" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="13.5" fill="#1a3a70">
    the line a rubric rewards
  </text>

  <line x1="530" y1="424" x2="574" y2="424" stroke="#cc2030" stroke-width="2.6"
        stroke-linecap="round" stroke-dasharray="9,6"/>
  <text x="586" y="429" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="13.5" fill="#cc2030">
    how it usually goes
  </text>

</svg>
