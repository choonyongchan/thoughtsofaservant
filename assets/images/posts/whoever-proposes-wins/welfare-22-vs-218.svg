<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 346" width="840" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Total score under each proposer</title><desc id="d">Guys propose: guys score 20, girls 2, total 22. Girls propose: guys 18, girls 200, total 218. Both matchings are stable.</desc>
