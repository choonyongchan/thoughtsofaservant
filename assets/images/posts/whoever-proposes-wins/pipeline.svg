<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The FirstDate pipeline</title><desc id="d">Your 33 answers are weighted by designer-chosen weights into compatibility scores, then ranked lists, then Gale-Shapley, then your match. The weighting step carries the value judgements; Gale-Shapley is the smallest step.</desc>
<defs>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
<marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C2C2C"/></marker>
</defs>
<rect width="840" height="380" rx="12" fill="#FFFFFF"/>
<text x="30" y="40" font-size="18" fill="#2C2C2C" text-anchor="start" font-weight="600">Where FirstDate's decisions are made</text>
<text x="30" y="64" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400">Gale-Shapley is the famous step, and the smallest one.</text>
<rect x="30" y="100" width="240" height="90" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="150" y="140" font-size="16" fill="#2C2C2C" text-anchor="middle" font-weight="600">Your 33 answers</text>
<text x="150" y="164" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">interests, kids, religion, hard no's</text>
<rect x="300" y="100" width="240" height="90" rx="10" fill="#F3F0FF" stroke="#8B5CF6" stroke-width="2.5"/>
<text x="420" y="140" font-size="16" fill="#2C2C2C" text-anchor="middle" font-weight="700">Weights</text>
<text x="420" y="164" font-size="13" fill="#8B5CF6" text-anchor="middle" font-weight="600">chosen by the designers</text>
<rect x="570" y="100" width="240" height="90" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="690" y="140" font-size="16" fill="#2C2C2C" text-anchor="middle" font-weight="600">Compatibility scores</text>
<text x="690" y="164" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">one number per possible pair</text>
<rect x="570" y="240" width="240" height="90" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="690" y="280" font-size="16" fill="#2C2C2C" text-anchor="middle" font-weight="600">Ranked lists</text>
<text x="690" y="304" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">everyone sorted by score</text>
<rect x="360" y="258" width="120" height="54" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="5 4" stroke-width="1.5"/>
<text x="420" y="290" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="600">Gale-Shapley</text>
<rect x="30" y="240" width="240" height="90" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="150" y="280" font-size="16" fill="#2C2C2C" text-anchor="middle" font-weight="600">Your match</text>
<text x="150" y="304" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">one per cycle, 72h to accept</text>
<line x1="274" y1="145" x2="294" y2="145" stroke="#2C2C2C" stroke-width="2" marker-end="url(#arrI)"/>
<line x1="544" y1="145" x2="564" y2="145" stroke="#2C2C2C" stroke-width="2" marker-end="url(#arrI)"/>
<line x1="690" y1="194" x2="690" y2="234" stroke="#2C2C2C" stroke-width="2" marker-end="url(#arrI)"/>
<line x1="564" y1="285" x2="484" y2="285" stroke="#2C2C2C" stroke-width="2" marker-end="url(#arrI)"/>
<line x1="356" y1="285" x2="276" y2="285" stroke="#2C2C2C" stroke-width="2" marker-end="url(#arrI)"/>
<text x="420" y="362" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">The value judgements sit in the purple box, before a single proposal is made.</text>
</svg>
