<rect x="30" y="88" width="240" height="280" rx="10" fill="#FAFAFA" stroke="#E5E7EB"/><text x="150.0" y="116" font-size="15" fill="#2C2C2C" text-anchor="middle" font-weight="600">Round 1</text>
<rect x="300" y="88" width="240" height="280" rx="10" fill="#FAFAFA" stroke="#E5E7EB"/><text x="420.0" y="116" font-size="15" fill="#2C2C2C" text-anchor="middle" font-weight="600">Round 2</text>
