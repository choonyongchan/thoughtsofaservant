<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Gale-Shapley round by round</title><desc id="d">Round 1: Darren and Rohan both propose to Jia Hui; she holds Rohan and rejects Darren. Round 2: Darren proposes to Nadia, who holds him. Result: Darren with Nadia, Rohan with Jia Hui, a stable matching.</desc>
<defs>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
<marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C2C2C"/></marker>
</defs>
<rect width="840" height="390" rx="12" fill="#FFFFFF"/>
<text x="30" y="40" font-size="18" fill="#2C2C2C" text-anchor="start" font-weight="600">Gale-Shapley, guys proposing</text>
<text x="30" y="64" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400">Both guys rank Jia Hui first. Jia Hui prefers Rohan; Nadia prefers Darren.</text>
