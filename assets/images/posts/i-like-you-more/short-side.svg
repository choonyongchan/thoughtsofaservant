<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The short side and the rural hospitals theorem</title><desc id="d">With two guys and four girls, guys proposing gives Darren and Jia Hui, Rohan and Nadia; girls proposing gives Darren and Nadia, Rohan and Jia Hui. Priya and Mei Ling are unmatched in both.</desc>
<defs>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
<marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C2C2C"/></marker>
</defs>
<rect width="840" height="470" rx="12" fill="#FFFFFF"/>
<text x="30" y="40" font-size="18" fill="#2C2C2C" text-anchor="start" font-weight="600">Who proposes changes the couples, not the leftovers</text>
<text x="30" y="64" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400">Two guys, four girls. Priya and Mei Ling are unmatched in every stable matching.</text>
