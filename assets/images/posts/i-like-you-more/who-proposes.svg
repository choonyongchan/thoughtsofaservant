<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Whoever proposes wins</title><desc id="d">When the guys propose, Darren gets Jia Hui and Rohan gets Nadia: both guys get their first choice and both girls their second. When the girls propose, Darren gets Nadia and Rohan gets Jia Hui: both girls get their first choice. Both matchings are stable.</desc>
<defs>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B5CF6"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
<marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2C2C2C"/></marker>
</defs>
<rect width="840" height="420" rx="12" fill="#FFFFFF"/>
<text x="30" y="40" font-size="18" fill="#2C2C2C" text-anchor="start" font-weight="600">Same people, same rankings, opposite winners</text>
<text x="30" y="64" font-size="13" fill="#6B7280" text-anchor="start" font-weight="400">Darren: Jia Hui &gt; Nadia.  Rohan: Nadia &gt; Jia Hui.  Jia Hui: Rohan &gt; Darren.  Nadia: Darren &gt; Rohan.</text>
