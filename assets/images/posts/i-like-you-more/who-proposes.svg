7.0" y="288" width="70" height="24" rx="12" fill="#2C2C2C"/><text x="752" y="304" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">1st pick</text>
<text x="420" y="404" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Pills show which choice each person ends up with. Both matchings are stable.</text>
