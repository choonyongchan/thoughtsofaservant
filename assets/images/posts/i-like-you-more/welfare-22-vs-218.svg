<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 604" width="840" height="604" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Gale-Shapley's pick versus the socially optimal matching</title><desc id="d">With the guys proposing, Gale-Shapley returns Darren with Jia Hui and Rohan with Nadia: guys 20, girls 2, total 22. The socially optimal matching, Darren with Nadia and Rohan with Jia Hui, scores guys 18, girls 200, total 218. The guys gain 2 points; the total falls by 196.</desc>
