<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540">

  <!-- Card -->
  <rect x="1" y="1" width="998" height="538" rx="10" fill="#FFFDF9" stroke="#E8DFD0" stroke-width="2"/>

  <!-- Title -->
  <text x="48" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C">One application, two halves</text>
  <rect x="48" y="66" width="64" height="3" fill="#cc2030"/>

  <!-- ══════════ LEFT: COMPULSORY ══════════ -->
  <text x="48" y="126" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12"
        font-weight="700" letter-spacing="2" fill="#1a3a70">COMPULSORY</text>

  <text x="48" y="166" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">Why this scholarship?</text>
  <rect x="48" y="176" width="430" height="48" rx="4" fill="#F2F6FC" stroke="#1a3a70" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#1a3a70" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="192" x2="454" y2="192"/>
    <line x1="64" y1="204" x2="424" y2="204"/>
    <line x1="64" y1="216" x2="362" y2="216"/>
  </g>

  <text x="48" y="252" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">Academic record</text>
  <rect x="48" y="262" width="430" height="48" rx="4" fill="#F2F6FC" stroke="#1a3a70" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#1a3a70" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="278" x2="454" y2="278"/>
    <line x1="64" y1="290" x2="440" y2="290"/>
    <line x1="64" y1="302" x2="336" y2="302"/>
  </g>

  <text x="48" y="338" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#6B7280">Extracurricular activities</text>
  <rect x="48" y="348" width="430" height="48" rx="4" fill="#F2F6FC" stroke="#1a3a70" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#1a3a70" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="364" x2="454" y2="364"/>
    <line x1="64" y1="376" x2="410" y2="376"/>
    <line x1="64" y1="388" x2="388" y2="388"/>
  </g>

  <!-- ══════════ RIGHT: OPTIONAL ══════════ -->
  <text x="522" y="126" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12"
        font-weight="700" letter-spacing="2" fill="#B0A08C">OPTIONAL</text>

  <text x="522" y="166" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#B0A08C">What would you do with the funding?</text>
  <rect x="522" y="176" width="430" height="48" rx="4" fill="none" stroke="#C9BFB0"
        stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="737" y="205" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="14" fill="#C9BFB0">left blank</text>

  <text x="522" y="252" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#B0A08C">Tell us something not in your CV</text>
  <rect x="522" y="262" width="430" height="48" rx="4" fill="none" stroke="#C9BFB0"
        stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="737" y="291" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="14" fill="#C9BFB0">left blank</text>

  <text x="522" y="338" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#B0A08C">Anything else we should know?</text>
  <rect x="522" y="348" width="430" height="48" rx="4" fill="none" stroke="#C9BFB0"
        stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="737" y="377" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="14" fill="#C9BFB0">left blank</text>

  <!-- ══════════ Insight bar ══════════ -->
  <rect x="48" y="440" width="904" height="62" rx="6" fill="#FDF0F1" stroke="#cc2030" stroke-opacity="0.30" stroke-width="1.5"/>
  <rect x="48" y="440" width="4" height="62" rx="2" fill="#cc2030"/>

  <text x="72" y="468" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="14.5" fill="#2C2C2C">
    Compulsory questions show what you will do to be considered.
  </text>
  <text x="72" y="490" font-family="'Inter', system-ui, 'Segoe UI', sans-serif" font-size="14.5"
        font-weight="600" fill="#cc2030">
    Optional questions show what you will do when nobody is checking.
  </text>

</svg>
