<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">

  <!-- Card -->
  <rect x="1" y="1" width="998" height="498" rx="10" fill="#FFFDF9" stroke="#E8DFD0" stroke-width="2"/>

  <!-- Title -->
  <text x="48" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C">Where your application lives</text>
  <rect x="48" y="66" width="64" height="3" fill="#cc2030"/>

  <!-- ══════════ The two circles ══════════ -->
  <!-- Left: what you want to build -->
  <circle cx="420" cy="260" r="140" fill="#1a3a70" fill-opacity="0.10" stroke="#1a3a70" stroke-opacity="0.55" stroke-width="2"/>
  <!-- Right: what the scholarship funds -->
  <circle cx="580" cy="260" r="140" fill="#cc2030" fill-opacity="0.09" stroke="#cc2030" stroke-opacity="0.50" stroke-width="2"/>

  <!-- Left label -->
  <text x="356" y="252" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="14" font-weight="600" fill="#1a3a70">What you want</text>
  <text x="356" y="272" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="14" font-weight="600" fill="#1a3a70">to build</text>

  <!-- Right label -->
  <text x="644" y="252" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="14" font-weight="600" fill="#a01825">What this</text>
  <text x="644" y="272" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="14" font-weight="600" fill="#a01825">scholarship funds</text>

  <!-- Overlap marker -->
  <circle cx="500" cy="205" r="4" fill="#2C2C2C"/>
  <line x1="500" y1="205" x2="500" y2="150" stroke="#2C2C2C" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="500" y="140" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.5" fill="#2C2C2C">YOUR CASE</text>

  <!-- ══════════ Caption ══════════ -->
  <text x="500" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" fill="#2C2C2C">
    The overlap is your application. Write from inside it.
  </text>
  <text x="500" y="466" text-anchor="middle" font-family="'Inter', system-ui, 'Segoe UI', sans-serif"
        font-size="13.5" fill="#cc2030">
    Where there is no overlap, winning is the bad outcome.
  </text>

</svg>
